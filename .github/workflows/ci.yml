name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix backend
      - run: npm ci --ignore-scripts --prefix frontend
      - run: npm test --prefix backend
        env:
          CRED_SECRET: synthetic-ci-only-credential-secret
      - run: npm run build --prefix frontend
      - name: Workflow JSON syntax
        run: python -m json.tool n8n/smart-inbox.workflow.json > /dev/null
      - run: python scripts/check-docs.py
